---
version: 2

updates:
  - package-ecosystem: pip
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: pre-commit
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: daily
